services:
  texas:
    build: .
    image: texas-rush:production
    container_name: texas-rush
    ports:
      - "127.0.0.1:8084:8000"
    env_file:
      - .env
    volumes:
      - ./data:/app/data
    environment:
      TZ: Asia/Shanghai
    mem_limit: 256m
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
