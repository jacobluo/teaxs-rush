<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Texas Rush · 德州大乱斗</title>
    <meta name="theme-color" content="#102621">
    <link rel="icon" href="data:,">
    <link rel="stylesheet" href="/static/css/style.css?v=20260912-directional-drawers2">
</head>
<body>
    <!-- ===== Navbar ===== -->
    <nav class="navbar">
        <div class="navbar-title">
            <span class="brand-mark">♠</span><div><span class="pixel-title">TEXAS RUSH</span><span class="brand-caption">德州大乱斗</span></div>
        </div>
        <div class="navbar-controls">
            <button class="pixel-btn pixel-btn-small pixel-btn-primary" id="btnJoin" onclick="joinPractice()">入座练习</button>
            <span id="connectionStatus" class="connection-status disconnected">● 离线</span>

            <!-- 游戏控制按钮（管理员专属） -->
            <div class="admin-only game-controls" style="gap: 6px;">
                <button class="pixel-btn pixel-btn-small" id="btnStart" onclick="sendControl('start')">开始</button>
                <button class="pixel-btn pixel-btn-small" id="btnPause" onclick="sendControl('pause')">暂停</button>
                <button class="pixel-btn pixel-btn-small" id="btnStep" onclick="sendControl('step')">单步</button>
                <button class="pixel-btn pixel-btn-small pixel-btn-danger" id="btnReset" onclick="sendControl('reset')">重置</button>
            </div>

            <button class="pixel-btn pixel-btn-small" onclick="openTablePanel('log')">牌局记录</button>
            <button class="pixel-btn pixel-btn-small admin-only-inline" onclick="openTablePanel('players')">设置</button>
            <!-- 登录/登出按钮 -->
            <button class="pixel-btn pixel-btn-small" id="btnLogin" onclick="showLoginModal()">房间登录</button>
            <button class="pixel-btn pixel-btn-small admin-only-inline" id="btnAdminLabel" style="cursor:default;display:none;">管理员</button>
            <button class="pixel-btn pixel-btn-small pixel-btn-danger" id="btnLogout" style="display:none;" onclick="logout()">登出</button>
        </div>
    </nav>

    <aside id="analysisDrawer" aria-label="AI 分析抽屉">
<section class="analysis-details" id="analysisDetails" aria-label="详细牌局分析" hidden>
                    <div class="analysis-heading"><strong>牌局分析</strong><button class="pixel-btn pixel-btn-small" onclick="PokerAdvisor.toggle()" aria-label="收起详细分析">收起</button></div>
                    <div class="analysis-numbers" id="analysisNumbers"></div>
                    <p class="analysis-threats" id="analysisThreats"></p>
                    <div class="analysis-coach">
                        <button class="pixel-btn pixel-btn-small" id="analysisAsk" onclick="PokerAdvisor.requestAdvice()">获取本轮 AI 建议</button>
                        <p id="analysisAdvice" role="status" aria-live="polite"></p>
                    </div>
                    <p class="analysis-assumptions" id="analysisAssumptions"></p>
                </section>
    </aside>

    <!-- ===== Main Content ===== -->
    <div class="main-container">
        <!-- Left: Canvas Table -->
        <div class="table-area">
            <div class="table-notice" id="tableNotice" role="status"></div>
            <div class="status-bar">
                <span class="status-item" id="statusHand">第 0 手</span>
                <div class="stage-indicator">
                    <span class="stage-dot" id="stagePreflop">翻前</span>
                    <span class="stage-dot" id="stageFlop">翻牌</span>
                    <span class="stage-dot" id="stageTurn">转牌</span>
                    <span class="stage-dot" id="stageRiver">河牌</span>
                </div>
                <span class="status-item gold" id="statusBlinds">小/大盲: $50/$100</span>
                <span class="status-item" id="statusAlive">存活: 0/0</span>
            </div>
            <div class="poker-table" id="pokerTable" aria-label="德州扑克牌桌"></div>
            <div class="human-action-dock">
            <div class="human-action-panel" id="humanActionPanel" role="region" aria-label="你的操作">
                <div class="action-topline"><span id="humanActionTitle">等待你的操作</span>
                    <section class="poker-advisor" id="pokerAdvisor" aria-label="牌局分析助手" hidden>                <div class="analysis-summary">
                    <div id="analysisMetrics"></div>
                    <button class="pixel-btn pixel-btn-small" id="analysisToggle" aria-expanded="false" aria-controls="analysisDetails" onclick="PokerAdvisor.toggle()">AI 分析</button>
                    <button class="pixel-btn pixel-btn-small" id="analysisRetry" onclick="PokerAdvisor.retryStats()" hidden>重新计算</button>
                </div>
</section>
                </div>
                <div class="action-summary"><div class="human-action-info">
                    <span id="humanActionHint"></span><span id="actionCountdown"></span>
                </div>
                <div class="action-hand" id="humanActionHand" aria-label="你的底牌"></div></div>
                <div class="human-action-controls" id="humanActionControls"></div>
            </div>
            </div>

        </div>

        <!-- Right: Side Panel -->
        <aside class="side-panel" id="tableSidePanel" data-open="false" data-mode="records" aria-label="牌桌工具">
            <div class="side-heading"><span id="tablePanelTitle">牌局记录</span><button class="pixel-btn pixel-btn-small" onclick="closeTablePanel()" aria-label="关闭牌桌面板">关闭 ×</button></div>
            <div class="tab-bar">
                <button class="tab-btn admin-tab" data-tab="models" onclick="switchTab('models')">模型管理</button>
                <button class="tab-btn admin-tab" data-tab="players" onclick="switchTab('players')">牌桌设置</button>
                <button class="tab-btn active" data-tab="log" onclick="switchTab('log')">牌局动态</button>
            </div>

            <!-- Models Tab -->
            <div class="tab-content" id="tabModels">
                <button class="pixel-btn pixel-btn-small pixel-btn-primary" style="width:100%;margin-bottom:10px;" onclick="ModelPanel.showAddForm()">+ 添加模型</button>
                <div id="modelFormContainer"></div>
                <div id="modelList"></div>
            </div>

            <!-- Players Tab -->
            <div class="tab-content" id="tabPlayers">
                <div id="playerCards"></div>
                <button class="pixel-btn pixel-btn-small" style="width:100%;margin-bottom:10px;" onclick="ConfigPanel.addPlayer()">+ 添加玩家</button>

                <div class="settings-section">
                    <div class="settings-title">游戏设置</div>
                    <div class="setting-row">
                        <span class="setting-label">最大手数</span>
                        <div class="setting-value">
                            <input type="number" class="pixel-input" id="settingMaxHands" value="10" min="0">
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">动作延迟(秒)</span>
                        <div class="setting-value">
                            <input type="number" class="pixel-input" id="settingDelay" value="2" min="0.5" step="0.5">
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">大盲注</span>
                        <div class="setting-value">
                            <input type="number" class="pixel-input" id="settingBigBlind" value="100" min="10" step="10">
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">起始筹码</span>
                        <div class="setting-value">
                            <input type="number" class="pixel-input" id="settingChips" value="10000" min="100" step="100">
                        </div>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">淘汰制</span>
                        <label class="toggle-switch">
                            <input type="checkbox" id="settingEliminate" checked>
                            <span class="toggle-slider"></span>
                        </label>
                    </div>
                    <div class="setting-row">
                        <span class="setting-label">涨盲间隔(手)</span>
                        <div class="setting-value">
                            <input type="number" class="pixel-input" id="settingBlindInc" value="0" min="0">
                        </div>
                    </div>
                </div>

                <button class="pixel-btn pixel-btn-primary" style="width:100%;margin-top:12px;" onclick="ConfigPanel.saveConfig()">保存配置</button>
            </div>

            <!-- Log Tab -->
            <div class="tab-content active" id="tabLog">
                <div class="log-container" id="logContainer"></div>
            </div>
        </aside>
    </div>

    <!-- ===== Login Modal ===== -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-card" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
            <button class="modal-close" aria-label="关闭登录" onclick="hideLoginModal()">×</button>
            <div class="modal-title" id="loginTitle">登录房间，准备入座</div><p class="modal-description">输入房间管理员密码后，你可以参与对局或管理牌桌。</p>
            <div class="form-group">
                <label class="form-label" for="loginPassword">房间密码</label>
                <input type="password" class="pixel-input" id="loginPassword" placeholder="请输入密码..."
                       onkeydown="if(event.key==='Enter')doLogin()">
            </div>
            <button class="pixel-btn pixel-btn-primary" style="width:100%;margin-top:12px;" onclick="doLogin()">登录并继续</button>
            <div class="modal-error" id="loginError"></div>
        </div>
    </div>

    <!-- Scripts -->
    <script src="/static/js/auth.js?v=20260912-directional-drawers2"></script>
    <script src="/static/js/avatar_renderer.js?v=20260912-street-actions"></script>
    <script src="/static/js/table_view.js?v=20260912-directional-drawers2"></script>
    <script src="/static/js/logger.js?v=20260912-street-actions"></script>
    <script src="/static/js/model_panel.js?v=20260912-deepseek"></script>
    <script src="/static/js/config_panel.js?v=20260912-street-actions"></script>
    <script src="/static/js/advisor.js?v=20260912-directional-drawers2"></script>
    <script src="/static/js/app.js?v=20260912-directional-drawers2"></script>
</body>
</html>
