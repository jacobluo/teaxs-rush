server {
    listen 80;
    listen [::]:80;
    server_name texas.webuddy.cc;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
        try_files $uri =404;
    }
    location / { return 301 https://texas.webuddy.cc$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name texas.webuddy.cc;
    ssl_certificate /etc/letsencrypt/live/texas.webuddy.cc/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/texas.webuddy.cc/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    add_header X-Content-Type-Options nosniff always;
    location / {
        proxy_pass http://127.0.0.1:8084;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_buffering off;
    }
}
